{% extends "base.html" %}

{% block title %}Set New Password — CarbonLens{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="panel">
        <div class="panel-header">
            <h1 class="panel-title" style="font-size: 1.3rem;">Set New Password</h1>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="form-group">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="8" required placeholder="Min 8 characters">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" required placeholder="Re-enter new password">
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Update Password &rarr;
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
